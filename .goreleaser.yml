version: 2.15

before:
  hooks:
    - go mod download
    - go vet ./...
    - go test -v ./...

builds:
  - id: linux
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64:
      - v3
    main: ./main.go
    ldflags: |
      -X github.com/libost/bandori-tg/version.Version={{ if eq .Env.RELEASE_CHANNEL "dev" }}{{ .ShortCommit }}{{ else }}{{ .Version }}{{ end }}
      -X github.com/libost/bandori-tg/version.BuildTime={{.Date}} 
      -X github.com/libost/bandori-tg/version.GitCommit={{.ShortCommit}} 
      -X github.com/libost/bandori-tg/version.Branch={{.Branch}} 
      {{ if eq .Env.RELEASE_CHANNEL "stable" }}-s -w{{ end }}
    binary: bandori-tg

  - id: windows
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v3
    main: ./main.go
    ldflags: |
      -X github.com/libost/bandori-tg/version.Version={{ if eq .Env.RELEASE_CHANNEL "dev" }}{{ .ShortCommit }}{{ else }}{{ .Version }}{{ end }}
      -X github.com/libost/bandori-tg/version.BuildTime={{.Date}} 
      -X github.com/libost/bandori-tg/version.GitCommit={{.ShortCommit}} 
      -X github.com/libost/bandori-tg/version.Branch={{.Branch}} 
      {{ if eq .Env.RELEASE_CHANNEL "stable" }}-s -w{{ end }}
    binary: bandori-tg

  - id: macos
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    goamd64:
      - v3
    main: ./main.go
    ldflags: |
      -X github.com/libost/bandori-tg/version.Version={{ if eq .Env.RELEASE_CHANNEL "dev" }}{{ .ShortCommit }}{{ else }}{{ .Version }}{{ end }}
      -X github.com/libost/bandori-tg/version.BuildTime={{.Date}} 
      -X github.com/libost/bandori-tg/version.GitCommit={{.ShortCommit}} 
      -X github.com/libost/bandori-tg/version.Branch={{.Branch}} 
      {{ if eq .Env.RELEASE_CHANNEL "stable" }}-s -w{{ end }}
    binary: bandori-tg

archives:
  - id: binaries
    formats: [binary]
    ids:
      - linux
      - windows
      - macos

checksum:
  name_template: checksums.txt

nfpms:
  - id: "bandori-tg"
    maintainer: "libost"
    vendor: "libost"
    description: "A Telegram bot for the mobile rhythm game BanG Dream! Girls Band Party!"
    license: "MIT"
    file_name_template: "bandori-tg_{{.Version}}_{{.Os}}_{{.Arch}}.deb"
    formats:
      - deb
    contents:
      - src: ./example.yaml
        dst: /etc/bandori-tg/config.yaml

release:
  prerelease: auto
  target_commitish: "{{ .Commit }}"
  mode: replace
  header: |
    {{ if eq .Env.RELEASE_CHANNEL "dev" }}## Pre-release {{ .ShortCommit }} auto generated at {{ .Date }}{{ else }}## Release {{ .Tag }} auto generated at {{ .Date }}{{ end }}  


changelog:
  sort: asc
  use: github
  abbrev: 7
  format: "{{ .SHA }}: {{ .Message }}{{ if .Logins }} ({{ .Logins | englishJoin }}){{ end }}"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Maintenance
      regexp: '^.*?(chore|docs|style|refactor|perf|test)(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - '^Merge pull request #\d+ from .+$'
      - '^Merge branch .+$'

announce:
  telegram:
    enabled: false
    chat_id: "@BangDream0114"
    message_template: |
      \#{{ .ProjectName | mdv2escape }} {{ if eq .Env.RELEASE_CHANNEL "dev" }}测试版{{ else }}新版本{{ end }}信息    

      {{ if eq .Env.RELEASE_CHANNEL "dev" }}🚀 {{ .ProjectName | mdv2escape }} 新测试版发行: {{ .ShortCommit | mdv2escape }}{{ else }}🎉 {{ .ProjectName | mdv2escape }} 新版本发行: {{ .Tag | mdv2escape }}{{ end }}  

      {{ if eq .Env.RELEASE_CHANNEL "dev" }}`{{ .ShortCommit | mdv2escape }}`: {{ .Env.COMMIT_MESSAGE | mdv2escape }}{{ end }}

      [有问题点我反馈]({{ .Env.FEEDBACK | mdv2escape }}) 

      [更新日志]({{ .ReleaseURL }})
    parse_mode: MarkdownV2